<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>נחש את הנחש - משחק תליין</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 10px;
      background: radial-gradient(circle at center, #0f1923, #05080c);
      color: #e0fbfc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
    }

    #game-container {
      width: 100%;
      max-width: 800px;
      background: #080d13;
      border: 2px solid #1f3548;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.1);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f3548;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 20px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
    
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .score-board { font-size: 14px; font-weight: bold; color: #ffd166; }
    
    .ctrl-btn {
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #00ffcc;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .top-section {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .snake-card {
      width: 220px;
      height: 155px;
      background: #121c27;
      border-radius: 10px;
      border: 3px solid #2ed573;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .snake-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .species-tag {
      position: absolute;
      bottom: 4px;
      background: rgba(0,0,0,0.85);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    #gallows-canvas {
      background: #0d151f;
      border: 1px solid #1f3548;
      border-radius: 10px;
      width: 135px;
      height: 155px;
    }

    .word-container {
      display: flex;
      gap: 6px;
      margin: 12px 0;
      flex-wrap: wrap;
      justify-content: center;
      direction: rtl;
    }
    .letter-slot {
      width: 30px;
      height: 38px;
      border-bottom: 3px solid #00ffcc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
    }
    .letter-slot.space { border-bottom: none; width: 12px; }

    .attempts-info {
      font-size: 14px;
      margin-bottom: 14px;
      color: #a8dadc;
    }
    .attempts-count { color: #ff4757; font-weight: bold; font-size: 16px; }

    /* עיצוב המקלדת */
    .keyboard {
      display: flex !important;
      flex-direction: column !important;
      gap: 8px;
      width: 100%;
      max-width: 520px;
      direction: rtl;
      margin-top: 5px;
    }
    .kb-row {
      display: flex !important;
      flex-direction: row !important;
      justify-content: center;
      gap: 5px;
      width: 100%;
    }
    .key-btn {
      flex: 1;
      max-width: 44px;
      min-width: 32px;
      height: 44px;
      min-height: 44px;
      border-radius: 6px;
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #e0fbfc;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .key-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: transparent; }
    .key-btn.correct { background: #2ed573 !important; color: #000 !important; }
    .key-btn.wrong { background: #ff4757 !important; color: #fff !important; }

    #end-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.94);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
    }
    #end-modal h2 { font-size: 28px; margin: 0 0 10px 0; }
    #end-modal p { font-size: 17px; color: #a8dadc; margin-bottom: 18px; }
    .btn-action {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #05080c;
      background: #00ffcc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>נחש את הנחש</h1>
    <div class="header-controls">
      <div class="score-board">רצף: <span id="streak">0</span></div>
      <button id="sound-toggle" class="ctrl-btn">🔊</button>
      <button id="fullscreen-btn" class="ctrl-btn" title="מסך מלא">⛶</button>
    </div>
  </header>

  <div class="top-section">
    <div class="snake-card" id="snake-card">
      <img id="snake-image" class="snake-img" alt="נחש" loading="eager" />
      <div id="species-tag" class="species-tag">רמז: נחש</div>
    </div>
    <canvas id="gallows-canvas" width="135" height="155"></canvas>
  </div>

  <div class="word-container" id="word-container"></div>

  <div class="attempts-info">
    פסילות שנותרו: <span id="remaining-attempts" class="attempts-count">4</span> / 4
  </div>

  <div class="keyboard" id="keyboard"></div>
</div>

<div id="end-modal">
  <h2 id="modal-title">כל הכבוד!</h2>
  <p id="modal-desc"></p>
  <button class="btn-action" onclick="startNewRound()">לנחש הבא</button>
</div>

<script>
// מסך מלא מותאם למובייל
const fsBtn = document.getElementById("fullscreen-btn");
const container = document.getElementById("game-container");
let isCustomFullscreen = false;

fsBtn.addEventListener("click", () => {
  isCustomFullscreen = !isCustomFullscreen;
  if (isCustomFullscreen) {
    container.style.position = "fixed";
    container.style.inset = "0";
    container.style.width = "100vw";
    container.style.height = "100vh";
    container.style.maxWidth = "100vw";
    container.style.zIndex = "999999";
    container.style.borderRadius = "0";
    fsBtn.textContent = "✕";
  } else {
    container.style.position = "relative";
    container.style.inset = "auto";
    container.style.width = "100%";
    container.style.height = "auto";
    container.style.maxWidth = "800px";
    container.style.zIndex = "auto";
    container.style.borderRadius = "16px";
    fsBtn.textContent = "⛶";
  }
});

// סאונד קל משקל
let audioCtx = null;
let soundEnabled = true;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, type, duration) {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {}
}

const Sounds = {
  correct: () => {
    playTone(600, 'sine', 0.08);
    setTimeout(() => playTone(900, 'sine', 0.12), 60);
  },
  wrong: () => { playTone(180, 'triangle', 0.15); },
  win: () => {
    playTone(523, 'sine', 0.1);
    setTimeout(() => playTone(659, 'sine', 0.1), 90);
    setTimeout(() => playTone(784, 'sine', 0.2), 180);
  },
  lose: () => {
    playTone(250, 'triangle', 0.15);
    setTimeout(() => playTone(180, 'triangle', 0.25), 140);
  }
};

document.getElementById("sound-toggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊" : "🔇";
});

// רשימת 41 נחשי ישראל
const SPECIES_LIST = [
  { name: "צפע מצוי", label: "ארסי ☠️", color: "#ff3838" },
  { name: "צפע החרמון", label: "ארסי ☠️", color: "#ff3838" },
  { name: "אפעה מגוון", label: "ארסי ☠️", color: "#ff3838" },
  { name: "שפיפון הנגב", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן חרטומים", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן גדול", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן קטן", label: "ארסי ☠️", color: "#ff3838" },
  { name: "שרף עין גדי", label: "ארסי ☠️", color: "#ff3838" },
  { name: "פתן שחור", label: "ארסי ☠️", color: "#ff3838" },
  { name: "תלום קשקשים מצוי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "תלום קשקשים מדברי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "ארבע קו מובהק", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "ארבע קו מצרי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול חברבר", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול אפור", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול אדמדם", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "נחש כיפה", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "מחרוזן הטבעות", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "זעמן שחור", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן מטבעות", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן זיתני", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן יפהפה", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן דק", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן סיני", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן אוכפים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "מטבעון מדבר", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "כרכן חלק", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "כרכן קרינים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחש מים משובץ", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "חנק משריץ", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחש חולות חרטומן", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שחור ראש ", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שחור ראש דרומי", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון טלוא ראש", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון קווים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון קולר", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון כתמים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון אזורים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחשיל מצוי", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחשיל חד ראש", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נימון דק", label: "לא ארסי 💚", color: "#2ed573" }
];

const MAX_MISTAKES = 4;
let currentSnake = null;
let guessedLetters = new Set();
let wrongAttempts = 0;
let streak = 0;
let isRoundActive = false;

const canvas = document.getElementById("gallows-canvas");
const ctx = canvas.getContext("2d");

function normalizeChar(ch) {
  const map = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
  return map[ch] || ch;
}

function drawGallows(step) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(12, 140);
  ctx.lineTo(122, 140);
  ctx.moveTo(35, 140);
  ctx.lineTo(35, 15);
  ctx.lineTo(90, 15);
  ctx.lineTo(90, 32);
  ctx.stroke();

  if (step < 1) return;
  ctx.strokeStyle = "#ff4757";
  ctx.beginPath();
  ctx.arc(90, 44, 12, 0, Math.PI * 2);
  ctx.stroke();

  if (step < 2) return;
  ctx.beginPath();
  ctx.moveTo(90, 56);
  ctx.lineTo(90, 92);
  ctx.stroke();

  if (step < 3) return;
  ctx.beginPath();
  ctx.moveTo(90, 66);
  ctx.lineTo(72, 82);
  ctx.moveTo(90, 66);
  ctx.lineTo(108, 82);
  ctx.stroke();

  if (step < 4) return;
  ctx.beginPath();
  ctx.moveTo(90, 92);
  ctx.lineTo(72, 120);
  ctx.moveTo(90, 92);
  ctx.lineTo(108, 120);
  ctx.stroke();
}

// פריסת מקלדת ווטסאפ (פ מימין עד ק משמאל וכו')
const KB_LAYOUT = [
  ["פ", "ם", "ן", "ו", "ט", "א", "ר", "ק"],
  ["ף", "ך", "ל", "ח", "י", "ע", "כ", "ג", "ד", "ש"],
  ["ץ", "ת", "צ", "מ", "נ", "ה", "ב", "ס", "ז"]
];

function buildKeyboard() {
  const container = document.getElementById("keyboard");
  if (!container) return;
  container.innerHTML = "";
  KB_LAYOUT.forEach(row => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "kb-row";
    row.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key-btn";
      btn.id = `key-${letter}`;
      btn.textContent = letter;
      btn.onclick = () => handleLetterGuess(letter);
      rowDiv.appendChild(btn);
    });
    container.appendChild(rowDiv);
  });
}

function startNewRound() {
  document.getElementById("end-modal").style.display = "none";
  guessedLetters.clear();
  wrongAttempts = 0;
  isRoundActive = true;

  currentSnake = SPECIES_LIST[Math.floor(Math.random() * SPECIES_LIST.length)];

  const imgEl = document.getElementById("snake-image");
  const enc = encodeURIComponent(currentSnake.name.trim());
  const raw = currentSnake.name.trim();

  const candidates = [
    `images/${enc}.jpg`,
    `images/${enc}.JPG`,
    `images/${raw}.jpg`,
    `images/${raw}.JPG`,
    `images/${enc}.png`,
    `images/${raw}.png`
  ];

  let cIdx = 0;
  function tryLoad() {
    if (cIdx < candidates.length) {
      imgEl.src = candidates[cIdx++];
    }
  }

  imgEl.onerror = tryLoad;
  tryLoad();

  const tagEl = document.getElementById("species-tag");
  tagEl.textContent = `רמז: ${currentSnake.label}`;
  tagEl.style.color = currentSnake.color;
  document.getElementById("snake-card").style.borderColor = currentSnake.color;

  updateWordDisplay();
  drawGallows(0);
  document.getElementById("remaining-attempts").textContent = MAX_MISTAKES;
  buildKeyboard();
}

function updateWordDisplay() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  const name = currentSnake.name;
  let allRevealed = true;

  for (let i = 0; i < name.length; i++) {
    const ch = name[i];
    const slot = document.createElement("div");

    if (ch === " ") {
      slot.className = "letter-slot space";
    } else {
      slot.className = "letter-slot";
      const normalizedCh = normalizeChar(ch);
      if (guessedLetters.has(normalizedCh)) {
        slot.textContent = ch;
      } else {
        slot.textContent = "";
        allRevealed = false;
      }
    }
    container.appendChild(slot);
  }

  if (allRevealed && isRoundActive) {
    endRound(true);
  }
}

function handleLetterGuess(letter) {
  if (!isRoundActive) return;
  const norm = normalizeChar(letter);
  if (guessedLetters.has(norm)) return;

  guessedLetters.add(norm);

  const btn = document.getElementById(`key-${letter}`);
  const targetNormalized = Array.from(currentSnake.name).map(normalizeChar);

  if (targetNormalized.includes(norm)) {
    if (btn) btn.classList.add("correct");
    Sounds.correct();
    updateWordDisplay();
  } else {
    if (btn) btn.classList.add("wrong");
    Sounds.wrong();
    wrongAttempts++;
    drawGallows(wrongAttempts);
    document.getElementById("remaining-attempts").textContent = MAX_MISTAKES - wrongAttempts;

    if (wrongAttempts >= MAX_MISTAKES) {
      endRound(false);
    }
  }

  if (btn) btn.disabled = true;
}

function endRound(isWin) {
  isRoundActive = false;
  const modal = document.getElementById("end-modal");
  const title = document.getElementById("modal-title");
  const desc = document.getElementById("modal-desc");

  if (isWin) {
    streak++;
    Sounds.win();
    title.textContent = "🏆 זיהוי מדויק!";
    title.style.color = "#00ffcc";
    desc.textContent = `כל הכבוד! הנחש הוא: ${currentSnake.name}`;
  } else {
    streak = 0;
    Sounds.lose();
    title.textContent = "☠️ נפסלת!";
    title.style.color = "#ff4757";
    desc.textContent = `הנחש בתמונה היה: ${currentSnake.name}`;
    revealFullWord();
  }

  document.getElementById("streak").textContent = streak;
  modal.style.display = "flex";
}

function revealFullWord() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  for (let ch of currentSnake.name) {
    const slot = document.createElement("div");
    slot.className = ch === " " ? "letter-slot space" : "letter-slot";
    slot.textContent = ch;
    if (ch !== " ") slot.style.color = "#ff6b81";
    container.appendChild(slot);
  }
}

window.addEventListener("keydown", (e) => {
  if (!isRoundActive) return;
  const key = e.key;
  if (/^[א-ת]$/.test(key)) {
    handleLetterGuess(key);
  }
});

startNewRound();
</script>
</body>
</html>
