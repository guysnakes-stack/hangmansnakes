<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>

  <style>

      margin: 0;
      padding: 10px;

      color: #e0fbfc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

      width: 100%;

    .tag-container {

<body>

<script>
// מסך מלא
const fsBtn = document.getElementById("fullscreen-btn");
const gContainer = document.getElementById("game-container");
let isCustomFullscreen = false;

fsBtn.addEventListener("click", () => {
  isCustomFullscreen = !isCustomFullscreen;
  const activeEl = (document.getElementById("quiz-container").style.display === "flex") ? document.getElementById("quiz-container") : gContainer;
  if (isCustomFullscreen) {
    activeEl.style.position = "fixed";
    activeEl.style.inset = "0";
    activeEl.style.width = "100vw";
    activeEl.style.height = "100vh";
    activeEl.style.maxWidth = "100vw";
    activeEl.style.zIndex = "999999";
    activeEl.style.borderRadius = "0";
    fsBtn.textContent = "✕";
  } else {
    activeEl.style.position = "relative";
    activeEl.style.inset = "auto";
    activeEl.style.width = "100%";
    activeEl.style.height = "auto";
    activeEl.style.maxWidth = "800px";
    activeEl.style.zIndex = "auto";
    activeEl.style.borderRadius = "16px";
    fsBtn.textContent = "⛶";
  }
});

// סאונד קל משקל
let audioCtx = null;
let soundEnabled = true;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, type, duration) {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {}
}

const Sounds = {
  correct: () => {
    playTone(600, 'sine', 0.08);
    setTimeout(() => playTone(900, 'sine', 0.12), 60);
  },
  wrong: () => { playTone(180, 'triangle', 0.15); },
  win: () => {
    playTone(523, 'sine', 0.1);
    setTimeout(() => playTone(659, 'sine', 0.1), 90);
    setTimeout(() => playTone(784, 'sine', 0.2), 180);
  },
  lose: () => {
    playTone(250, 'triangle', 0.15);
    setTimeout(() => playTone(180, 'triangle', 0.25), 140);
  }
};

document.getElementById("sound-toggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊" : "🔇";
});

const MAX_MISTAKES = 4;
let currentSnake = null;
let guessedLetters = new Set();
let wrongAttempts = 0;
let isRoundActive = false;

let hangmanScore = 0; // ניקוד תליין מצטבר (עד 41)
let snakeDeck = [];
let currentIndexInDeck = 0;

function resetAndShuffleDeck() {
  snakeDeck = [...SPECIES_LIST];
  for (let i = snakeDeck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [snakeDeck[i], snakeDeck[j]] = [snakeDeck[j], snakeDeck[i]];
  }
  currentIndexInDeck = 0;
}

const canvas = document.getElementById("gallows-canvas");
const ctx = canvas.getContext("2d");

function normalizeChar(ch) {
  const map = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
  return map[ch] || ch;
}

function getLetterVariants(normChar) {
  const reverseMap = {
    'כ': ['כ', 'ך'],
    'מ': ['מ', 'ם'],
    'נ': ['נ', 'ן'],
    'פ': ['פ', 'ף'],
    'צ': ['צ', 'ץ']
  };
  return reverseMap[normChar] || [normChar];
}

function drawGallows(step) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(12, 140);
  ctx.lineTo(122, 140);
  ctx.moveTo(35, 140);
  ctx.lineTo(35, 15);
  ctx.lineTo(90, 15);
  ctx.lineTo(90, 32);
  ctx.stroke();

  if (step < 1) return;
  ctx.strokeStyle = "#ff4757";
  ctx.beginPath();
  ctx.arc(90, 44, 12, 0, Math.PI * 2);
  ctx.stroke();

  if (step < 2) return;
  ctx.beginPath();
  ctx.moveTo(90, 56);
  ctx.lineTo(90, 92);
  ctx.stroke();

  if (step < 3) return;
  ctx.beginPath();
  ctx.moveTo(90, 66);
  ctx.lineTo(72, 82);
  ctx.moveTo(90, 66);
  ctx.lineTo(108, 82);
  ctx.stroke();

  if (step < 4) return;
  ctx.beginPath();
  ctx.moveTo(90, 92);
  ctx.lineTo(72, 120);
  ctx.moveTo(90, 92);
  ctx.lineTo(108, 120);
  ctx.stroke();
}

const KB_LAYOUT = [
  ["פ", "ם", "ן", "ו", "ט", "א", "ר", "ק"],
  ["ף", "ך", "ל", "ח", "י", "ע", "כ", "ג", "ד", "ש"],
  ["ץ", "ת", "צ", "מ", "נ", "ה", "ב", "ס", "ז"]
];

function buildKeyboard() {
  const container = document.getElementById("keyboard");
  if (!container) return;
  container.innerHTML = "";
  KB_LAYOUT.forEach(row => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "kb-row";
    row.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key-btn";
      btn.id = `key-${letter}`;
      btn.textContent = letter;
      btn.onclick = () => handleLetterGuess(letter);
      rowDiv.appendChild(btn);
    });
    container.appendChild(rowDiv);
  });
}

function startNewRound() {
  document.getElementById("end-modal").style.display = "none";
  document.getElementById("modal-report-wrapper").innerHTML = "";
  guessedLetters.clear();
  wrongAttempts = 0;
  isRoundActive = true;

  if (currentIndexInDeck >= snakeDeck.length) {
    // השחקן סיים את כל 41 הנחשים! עוברים אוטומטית למבחן המסכם
    switchToQuiz();
    return;
  }

  currentSnake = snakeDeck[currentIndexInDeck];
  currentIndexInDeck++;

  document.getElementById("round-indicator").textContent = `נחש: ${currentIndexInDeck}/${SPECIES_LIST.length}`;
  document.getElementById("hangman-points").textContent = hangmanScore;

  const imgEl = document.getElementById("snake-image");
  const enc = encodeURIComponent(currentSnake.name.trim());
  const raw = currentSnake.name.trim();

  const candidates = [
    `images/${enc}.jpg`,
    `images/${enc}.JPG`,
    `images/${raw}.jpg`,
    `images/${raw}.JPG`,
    `images/${enc}.png`,
    `images/${raw}.png`
  ];

  let cIdx = 0;
  function tryLoad() {
    if (cIdx < candidates.length) {
      imgEl.src = candidates[cIdx++];
    }
  }

  imgEl.onerror = tryLoad;
  tryLoad();

  const tagEl = document.getElementById("species-tag");
  tagEl.textContent = `רמז: ${currentSnake.label}`;
  tagEl.style.color = currentSnake.color;
  document.getElementById("snake-card").style.borderColor = currentSnake.color;

  updateWordDisplay();
  drawGallows(0);
  document.getElementById("remaining-attempts").textContent = MAX_MISTAKES;
  buildKeyboard();
}

function updateWordDisplay() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  const name = currentSnake.name;
  let allRevealed = true;

  for (let i = 0; i < name.length; i++) {
    const ch = name[i];
    const slot = document.createElement("div");

    if (ch === " ") {
      slot.className = "letter-slot space";
    } else {
      slot.className = "letter-slot";
      const normalizedCh = normalizeChar(ch);
      if (guessedLetters.has(normalizedCh)) {
        slot.textContent = ch;
      } else {
        slot.textContent = "";
        allRevealed = false;
      }
    }
    container.appendChild(slot);
  }

  if (allRevealed && isRoundActive) {
    endRound(true);
  }
}

function handleLetterGuess(letter) {
  if (!isRoundActive) return;
  const norm = normalizeChar(letter);
  if (guessedLetters.has(norm)) return;

  guessedLetters.add(norm);

  const targetNormalized = Array.from(currentSnake.name).map(normalizeChar);
  const isMatch = targetNormalized.includes(norm);
  const variants = getLetterVariants(norm);

  variants.forEach(v => {
    const btn = document.getElementById(`key-${v}`);
    if (btn) {
      btn.classList.add(isMatch ? "correct" : "wrong");
      btn.disabled = true;
    }
  });

  if (isMatch) {
    Sounds.correct();
    updateWordDisplay();
  } else {
    Sounds.wrong();
    wrongAttempts++;
    drawGallows(wrongAttempts);
    document.getElementById("remaining-attempts").textContent = MAX_MISTAKES - wrongAttempts;

    if (wrongAttempts >= MAX_MISTAKES) {
      endRound(false);
    }
  }
}

let modalNextAction = "hangman";

function endRound(isWin) {
  isRoundActive = false;
  const modal = document.getElementById("end-modal");
  const title = document.getElementById("modal-title");
  const desc = document.getElementById("modal-desc");
  const btn = document.getElementById("modal-btn");

  const isFinalSnake = (currentIndexInDeck >= SPECIES_LIST.length);

  if (isWin) {
    hangmanScore++;
    document.getElementById("hangman-points").textContent = hangmanScore;
    Sounds.win();
    title.textContent = "🏆 זיהוי מדויק!";
    title.style.color = "#00ffcc";
    desc.textContent = `כל הכבוד! הנחש הוא: ${currentSnake.name} (+1 נקודה)`;
  } else {
    Sounds.lose();
    title.textContent = "☠️ נפסלת!";
    title.style.color = "#ff4757";
    desc.textContent = `הנחש בתמונה היה: ${currentSnake.name}`;
    revealFullWord();
  }

  if (isFinalSnake) {
    btn.textContent = "למבחן המסכם (3 שאלות) ✍️";
    modalNextAction = "quiz";
  } else {
    btn.textContent = "לנחש הבא ⇦";
    modalNextAction = "hangman";
  }

  modal.style.display = "flex";
}

function handleModalConfirm() {
  document.getElementById("end-modal").style.display = "none";
  if (modalNextAction === "quiz") {
    switchToQuiz();
  } else if (modalNextAction === "restart_all") {
    hangmanScore = 0;
    resetAndShuffleDeck();
    switchToHangman();
    startNewRound();
  } else {
    startNewRound();
  }
}

function revealFullWord() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  for (let ch of currentSnake.name) {
    const slot = document.createElement("div");
    slot.className = ch === " " ? "letter-slot space" : "letter-slot";
    slot.textContent = ch;
    if (ch !== " ") slot.style.color = "#ff6b81";
    container.appendChild(slot);
  }
}

window.addEventListener("keydown", (e) => {
  if (!isRoundActive) return;
  const key = e.key;
  if (/^[א-ת]$/.test(key)) {
    handleLetterGuess(key);
  }
});

// ==========================================
// מנוע שלב ב': המבחן המסכם (3 שאלות סיווג)
// ==========================================
const QUIZ_QUESTIONS = [
  {
    type: "venomous",
    title: "שאלה 1 מתוך 3: נחשים ארסיים",
    desc: "סמן את כל 9 הנחשים הארסיים של ישראל מתוך הרשימה:",
    maxPoints: 9,
    expectedCount: 9
  },
  {
    type: "semi",
    title: "שאלה 2 מתוך 3: נחשים תת-ארסיים",
    desc: "סמן את כל 8 הנחשים התת-ארסיים של ישראל מתוך הרשימה:",
    maxPoints: 20,
    expectedCount: 8
  },
  {
    type: "non",
    title: "שאלה 3 מתוך 3: נחשים לא-ארסיים",
    desc: "סמן את כל 24 הנחשים הלא-ארסיים של ישראל מתוך הרשימה:",
    maxPoints: 30,
    expectedCount: 24
  }
];

let currentQuizIdx = 0;
let userQuizSelections = { venomous: new Set(), semi: new Set(), non: new Set() };
let quizScores = { venomous: 0, semi: 0, non: 0 };

function switchToQuiz() {
  document.getElementById("game-container").style.display = "none";
  document.getElementById("quiz-container").style.display = "flex";
  currentQuizIdx = 0;
  userQuizSelections = { venomous: new Set(), semi: new Set(), non: new Set() };
  loadQuizQuestion(0);
}

function switchToHangman() {
  document.getElementById("quiz-container").style.display = "none";
  document.getElementById("game-container").style.display = "flex";
}

function loadQuizQuestion(qIdx) {
  const q = QUIZ_QUESTIONS[qIdx];
  document.getElementById("quiz-question-title").textContent = q.title;
  document.getElementById("quiz-question-desc").textContent = q.desc;
  document.getElementById("quiz-question-badge").textContent = `ערך השאלה: ${q.maxPoints} נקודות`;
  document.getElementById("quiz-next-btn").textContent = (qIdx === QUIZ_QUESTIONS.length - 1) ? "סיום ושקלול ציון 🏁" : "לשאלה הבאה ⇦";

  const container = document.getElementById("tag-container");
  container.innerHTML = "";

  // בנק שמות ממוין לפי א'-ב' לבחירה נוחה
  const sortedSnakes = [...SPECIES_LIST].sort((a,b) => a.name.localeCompare(b.name, 'he'));
  const currentSet = userQuizSelections[q.type];

  sortedSnakes.forEach(s => {
    const tag = document.createElement("button");
    tag.className = "snake-tag" + (currentSet.has(s.name) ? " selected" : "");
    tag.textContent = s.name;
    tag.onclick = () => {
      if (currentSet.has(s.name)) {
        currentSet.delete(s.name);
        tag.classList.remove("selected");
      } else {
        currentSet.add(s.name);
        tag.classList.add("selected");
      }
      updateQuizCounter();
    };
    container.appendChild(tag);
  });

  updateQuizCounter();
}

function updateQuizCounter() {
  const q = QUIZ_QUESTIONS[currentQuizIdx];
  const count = userQuizSelections[q.type].size;
  document.getElementById("quiz-selected-count").textContent = `סומנו: ${count} מתוך ${q.expectedCount}`;
}

function handleQuizNext() {
  // חישוב ניקוד לשאלה הנוכחית
  const q = QUIZ_QUESTIONS[currentQuizIdx];
  const chosen = userQuizSelections[q.type];
  const correctSpecies = SPECIES_LIST.filter(s => s.type === q.type).map(s => s.name);
  
  let correctHits = 0;
  let wrongHits = 0;

  chosen.forEach(name => {
    if (correctSpecies.includes(name)) correctHits++;
    else wrongHits++;
  });

  // ציון יחסי לשאלה
  let rawScore = (correctHits - (wrongHits * 0.5));
  if (rawScore < 0) rawScore = 0;
  const finalQuestionScore = Math.round((rawScore / q.expectedCount) * q.maxPoints * 10) / 10;
  quizScores[q.type] = Math.min(q.maxPoints, finalQuestionScore);

  currentQuizIdx++;
  if (currentQuizIdx < QUIZ_QUESTIONS.length) {
    loadQuizQuestion(currentQuizIdx);
  } else {
    showFinalReport();
  }
}

function showFinalReport() {
  const modal = document.getElementById("end-modal");
  const title = document.getElementById("modal-title");
  const desc = document.getElementById("modal-desc");
  const reportWrapper = document.getElementById("modal-report-wrapper");
  const btn = document.getElementById("modal-btn");

  const totalScore = Math.round(hangmanScore + quizScores.venomous + quizScores.semi + quizScores.non);

  title.textContent = "🎓 תעודת גמר: מבחן נחשי ישראל";
  title.style.color = "#ffd166";
  desc.textContent = "הנה שקלול התוצאות המלא שלך בכל חלקי המבחן:";

  reportWrapper.innerHTML = `
    <div class="report-card">
      <div class="report-line">
        <span>זיהוי חזותי בתליין (41 נחשים):</span>
        <strong style="color:#00ffcc;">${hangmanScore} / 41</strong>
      </div>
      <div class="report-line">
        <span>שאלה 1: נחשים ארסיים:</span>
        <strong style="color:#ff4757;">${quizScores.venomous} / 9</strong>
      </div>
      <div class="report-line">
        <span>שאלה 2: נחשים תת-ארסיים:</span>
        <strong style="color:#ff9f1a;">${quizScores.semi} / 20</strong>
      </div>
      <div class="report-line">
        <span>שאלה 3: נחשים לא-ארסיים:</span>
        <strong style="color:#2ed573;">${quizScores.non} / 30</strong>
      </div>
      <div class="report-line total">
        <span>ציון משוקלל סופי:</span>
        <span>${totalScore} / 100</span>
      </div>
    </div>
  `;

  btn.textContent = "משחק ומבחן חדש 🔄";
  modalNextAction = "restart_all";
  modal.style.display = "flex";
  Sounds.win();
}

// אתחול ראשוני
resetAndShuffleDeck();
startNewRound();
</script>
