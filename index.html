<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>נחש את הנחש - משחק תליין</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: #05080c;
    }

    body {
      background: radial-gradient(circle at center, #0f1923, #05080c);
      color: #e0fbfc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 8px;
    }

    #game-container {
      width: 100%;
      max-width: 850px;
      height: 100%;
      max-height: 850px;
      background: #080d13;
      border: 2px solid #1f3548;
      border-radius: 16px;
      box-shadow: 0 0 25px rgba(0, 255, 204, 0.1);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f3548;
      padding-bottom: 6px;
    }
    h1 { margin: 0; font-size: 19px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
    
    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .score-board { font-size: 14px; font-weight: bold; color: #ffd166; }
    
    .ctrl-btn {
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #00ffcc;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .top-section {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
    }

    .snake-card {
      width: 220px;
      height: 155px;
      max-width: 60%;
      background: #121c27;
      border-radius: 10px;
      border: 3px solid #2ed573;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .snake-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .species-tag {
      position: absolute;
      bottom: 4px;
      background: rgba(0,0,0,0.85);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    #gallows-canvas {
      background: #0d151f;
      border: 1px solid #1f3548;
      border-radius: 10px;
      width: 135px;
      height: 155px;
    }

    .word-container {
      display: flex;
      gap: 5px;
      margin: 8px 0;
      flex-wrap: wrap;
      justify-content: center;
      direction: rtl;
    }
    .letter-slot {
      width: 28px;
      height: 36px;
      border-bottom: 3px solid #00ffcc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: 900;
      color: #ffffff;
    }
    .letter-slot.space { border-bottom: none; width: 10px; }

    .attempts-info {
      font-size: 14px;
      margin-bottom: 6px;
      color: #a8dadc;
    }
    .attempts-count { color: #ff4757; font-weight: bold; font-size: 16px; }

    /* מקלדת מסודרת מימין לשמאל */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 520px;
      direction: rtl;
    }
    .kb-row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 4px;
      width: 100%;
      direction: rtl;
    }
    .key-btn {
      flex: 1;
      max-width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #e0fbfc;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .key-btn:disabled { opacity: 0.25; cursor: not-allowed; border-color: transparent; }
    .key-btn.correct { background: #2ed573 !important; color: #000 !important; }
    .key-btn.wrong { background: #ff4757 !important; color: #fff !important; }

    #end-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.94);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
    }
    #end-modal h2 { font-size: 28px; margin: 0 0 10px 0; }
    #end-modal p { font-size: 17px; color: #a8dadc; margin-bottom: 18px; }
    .btn-action {
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      color: #05080c;
      background: #00ffcc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>נחש את הנחש</h1>
    <div class="header-controls">
      <div class="score-board">רצף: <span id="streak">0</span></div>
      <button id="sound-toggle" class="ctrl-btn">🔊</button>
      <button id="fullscreen-btn" class="ctrl-btn" title="מסך מלא">⛶</button>
    </div>
  </header>

  <div class="top-section">
    <div class="snake-card" id="snake-card">
      <img id="snake-image" class="snake-img" alt="נחש" loading="eager" />
      <div id="species-tag" class="species-tag">רמז: נחש</div>
    </div>
    <canvas id="gallows-canvas" width="135" height="155"></canvas>
  </div>

  <div class="word-container" id="word-container"></div>

  <div class="attempts-info">
    פסילות שנותרו: <span id="remaining-attempts" class="attempts-count">4</span> / 4
  </div>

  <div class="keyboard" id="keyboard"></div>
</div>

<div id="end-modal">
  <h2 id="modal-title">כל הכבוד!</h2>
  <p id="modal-desc"></p>
  <button class="btn-action" onclick="startNewRound()">לנחש הבא</button>
</div>

<script>
// מסך מלא מותאם למובייל
const fsBtn = document.getElementById("fullscreen-btn");
const container = document.getElementById("game-container");
let isCustomFullscreen = false;

fsBtn.addEventListener("click", () => {
  isCustomFullscreen = !isCustomFullscreen;
  if (isCustomFullscreen) {
    container.style.position = "fixed";
    container.style.inset = "0";
    container.style.width = "100vw";
    container.style.height = "100vh";
    container.style.maxWidth = "100vw";
    container.style.maxHeight = "100vh";
    container.style.zIndex = "999999";
    container.style.borderRadius = "0";
    fsBtn.textContent = "✕";
  } else {
    container.style.position = "relative";
    container.style.inset = "auto";
    container.style.width = "100%";
    container.style.height = "100%";
    container.style.maxWidth = "850px";
    container.style.maxHeight = "850px";
    container.style.zIndex = "auto";
    container.style.borderRadius = "16px";
    fsBtn.textContent = "⛶";
  }
});

// סאונד קל משקל
let audioCtx = null;
let soundEnabled = true;

function getAudioContext() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) audioCtx = new AudioContextClass();
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playTone(freq, type, duration) {
  if (!soundEnabled) return;
  const ctx = getAudioContext();
  if (!ctx) return;
  try {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.linearRampToValueAtTime(0.001, now + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + duration);
  } catch (e) {}
}

const Sounds = {
  correct: () => {
    playTone(600, 'sine', 0.08);
    setTimeout(() => playTone(900, 'sine', 0.12), 60);
  },
  wrong: () => { playTone(180, 'triangle', 0.15); },
  win: () => {
    playTone(523, 'sine', 0.1);
    setTimeout(() => playTone(659, 'sine', 0.1), 90);
    setTimeout(() => playTone(784, 'sine', 0.2), 180);
  },
  lose: () => {
    playTone(250, 'triangle', 0.15);
    setTimeout(() => playTone(180, 'triangle', 0.25), 140);
  }
};

document.getElementById("sound-toggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊" : "🔇";
});
