<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>נחש את הנחש - משחק תליין</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 10px;
      background: radial-gradient(circle at center, #0f1923, #05080c);
      color: #e0fbfc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh;
    }

    #game-container {
      width: 100%;
      max-width: 850px;
      background: #080d13;
      border: 2px solid #1f3548;
      border-radius: 16px;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.15);
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f3548;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 22px; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.4); }
    
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .score-board { font-size: 15px; font-weight: bold; color: #ffd166; }
    
    #sound-toggle {
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #00ffcc;
      border-radius: 8px;
      padding: 5px 12px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-section {
      display: flex;
      gap: 15px;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .snake-card {
      width: 250px;
      height: 180px;
      max-width: 100%;
      background: #121c27;
      border-radius: 12px;
      border: 3px solid #2ed573;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .snake-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .species-tag {
      position: absolute;
      bottom: 6px;
      background: rgba(0,0,0,0.85);
      padding: 3px 10px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: bold;
    }

    #gallows-canvas {
      background: #0d151f;
      border: 1px solid #1f3548;
      border-radius: 12px;
      width: 160px;
      height: 180px;
    }

    .word-container {
      display: flex;
      gap: 6px;
      margin: 18px 0 12px 0;
      flex-wrap: wrap;
      justify-content: center;
      direction: rtl;
    }
    .letter-slot {
      width: 32px;
      height: 42px;
      border-bottom: 3px solid #00ffcc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(0,255,204,0.7);
    }
    .letter-slot.space {
      border-bottom: none;
      width: 14px;
    }

    .attempts-info {
      font-size: 15px;
      margin-bottom: 12px;
      color: #a8dadc;
    }
    .attempts-count {
      color: #ff4757;
      font-weight: bold;
      font-size: 17px;
    }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 550px;
    }
    .kb-row {
      display: flex;
      justify-content: center;
      gap: 4px;
    }
    .key-btn {
      flex: 1;
      max-width: 42px;
      height: 44px;
      border-radius: 6px;
      background: #1a2a3a;
      border: 1px solid #2d4a65;
      color: #e0fbfc;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .key-btn:hover:not(:disabled) {
      background: #00ffcc;
      color: #05080c;
    }
    .key-btn:disabled {
      opacity: 0.25;
      cursor: not-allowed;
      border-color: transparent;
    }
    .key-btn.correct { background: #2ed573 !important; color: #000 !important; border-color: #2ed573 !important; }
    .key-btn.wrong { background: #ff4757 !important; color: #fff !important; border-color: #ff4757 !important; }

    #end-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.92);
      z-index: 50;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    #end-modal h2 { font-size: 32px; margin: 0 0 10px 0; }
    #end-modal p { font-size: 18px; color: #a8dadc; margin-bottom: 20px; }
    .btn-action {
      padding: 12px 28px;
      font-size: 17px;
      font-weight: bold;
      color: #05080c;
      background: #00ffcc;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0,255,204,0.4);
    }
    .btn-action:hover { background: #38ef7d; }
  </style>
</head>
<body>

<div id="game-container">
  <header>
    <h1>נחש את הנחש</h1>
    <div class="header-controls">
      <div class="score-board">רצף ניצחונות: <span id="streak">0</span></div>
      <button id="sound-toggle" title="השתק/הפעל קול">🔊 סאונד פעיל</button>
    </div>
  </header>

  <div class="top-section">
    <div class="snake-card" id="snake-card">
      <img id="snake-image" class="snake-img" alt="נחש לזיהוי" />
      <div id="species-tag" class="species-tag">רמז: נחש</div>
    </div>

    <canvas id="gallows-canvas" width="160" height="180"></canvas>
  </div>

  <div class="word-container" id="word-container"></div>

  <div class="attempts-info">
    פסילות שנותרו: <span id="remaining-attempts" class="attempts-count">4</span> / 4
  </div>

  <div class="keyboard" id="keyboard"></div>
</div>

<div id="end-modal">
  <h2 id="modal-title">כל הכבוד!</h2>
  <p id="modal-desc"></p>
  <button class="btn-action" onclick="startNewRound()">לנחש הבא</button>
</div>

<script>
// --- מנוע סאונד משופר כולל Audio Unlocker ל-iFrame ולנייד ---
let audioCtx = null;
let soundEnabled = true;

function unlockAudio() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

// שחרור נעילה בכל מגע/לחיצה ראשונה על המסך
window.addEventListener('click', unlockAudio, { once: false });
window.addEventListener('touchstart', unlockAudio, { once: false });
window.addEventListener('keydown', unlockAudio, { once: false });

function playTone(freq, type, duration, delay = 0) {
  if (!soundEnabled) return;
  unlockAudio();
  if (!audioCtx) return;

  setTimeout(() => {
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      
      // ווליום מוגבר מעט כדי שישמעו בבירור
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + duration);
    } catch(err) {
      console.warn("Audio error:", err);
    }
  }, delay);
}

const Sounds = {
  correct: () => {
    playTone(587.33, 'triangle', 0.10, 0);  // D5
    playTone(880.00, 'triangle', 0.20, 70); // A5
  },
  wrong: () => {
    playTone(190.00, 'sawtooth', 0.16, 0);  // טון צורם
    playTone(140.00, 'sawtooth', 0.24, 80);
  },
  win: () => {
    playTone(523.25, 'triangle', 0.12, 0);
    playTone(659.25, 'triangle', 0.12, 110);
    playTone(783.99, 'triangle', 0.12, 220);
    playTone(1046.50, 'triangle', 0.35, 330);
  },
  lose: () => {
    playTone(320.00, 'sawtooth', 0.20, 0);
    playTone(260.00, 'sawtooth', 0.20, 140);
    playTone(200.00, 'sawtooth', 0.40, 280);
  }
};

document.getElementById("sound-toggle").addEventListener("click", (e) => {
  e.stopPropagation();
  unlockAudio();
  soundEnabled = !soundEnabled;
  document.getElementById("sound-toggle").textContent = soundEnabled ? "🔊 סאונד פעיל" : "🔇 סאונד כבוי";
  if (soundEnabled) Sounds.correct(); // צליל אינדיקציה קטן
});

// --- רשימת נחשי ישראל ---
const SPECIES_LIST = [
  // 9 ארסיים
  { name: "צפע מצוי", label: "ארסי ☠️", color: "#ff3838" },
  { name: "צפע החרמון", label: "ארסי ☠️", color: "#ff3838" },
  { name: "אפעה מגוון", label: "ארסי ☠️", color: "#ff3838" },
  { name: "שפיפון הנגב", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן חרטומים", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן גדול", label: "ארסי ☠️", color: "#ff3838" },
  { name: "עכן קטן", label: "ארסי ☠️", color: "#ff3838" },
  { name: "שרף עין גדי", label: "ארסי ☠️", color: "#ff3838" },
  { name: "פתן שחור", label: "ארסי ☠️", color: "#ff3838" },

  // 9 תת-ארסיים
  { name: "תלום קשקשים מצוי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "תלום קשקשים מדברי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "ארבע קו מובהק", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "ארבע קו מצרי", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול חברבר", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול אפור", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "עין חתול אדמדם", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "נחש כיפה", label: "תת-ארסי ⚠️", color: "#ff9f1a" },
  { name: "מחרוזן הטבעות", label: "תת-ארסי ⚠️", color: "#ff9f1a" },

  // 23 לא ארסיים
  { name: "זעמן שחור", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן מטבעות", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן זיתני", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן יפהפה", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן דק", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן סיני", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "זעמן אוכפים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "מטבעון מדבר", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "כרכן חלק", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "כרכן קרינים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחש מים משובץ", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "חנק משריץ", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחש חולות חרטומן", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שחור ראש מצוי", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שחור ראש דרומי", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון טלוא ראש", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון קווים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון קולר", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון כתמים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "שלוון אזורים", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחשיל מצוי", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נחשיל חד ראש", label: "לא ארסי 💚", color: "#2ed573" },
  { name: "נימון דק", label: "לא ארסי 💚", color: "#2ed573" }
];

const MAX_MISTAKES = 4;
let currentSnake = null;
let guessedLetters = new Set();
let wrongAttempts = 0;
let streak = 0;
let isRoundActive = false;

const canvas = document.getElementById("gallows-canvas");
const ctx = canvas.getContext("2d");

function normalizeChar(ch) {
  const map = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
  return map[ch] || ch;
}

function drawGallows(step) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(15, 160);
  ctx.lineTo(145, 160);
  ctx.moveTo(40, 160);
  ctx.lineTo(40, 20);
  ctx.lineTo(105, 20);
  ctx.lineTo(105, 40);
  ctx.stroke();

  if (step < 1) return;

  // שלב 1: ראש
  ctx.strokeStyle = "#ff4757";
  ctx.beginPath();
  ctx.arc(105, 55, 14, 0, Math.PI * 2);
  ctx.stroke();

  if (step < 2) return;

  // שלב 2: גוף
  ctx.beginPath();
  ctx.moveTo(105, 69);
  ctx.lineTo(105, 110);
  ctx.stroke();

  if (step < 3) return;

  // שלב 3: ידיים
  ctx.beginPath();
  ctx.moveTo(105, 80);
  ctx.lineTo(85, 98);
  ctx.moveTo(105, 80);
  ctx.lineTo(125, 98);
  ctx.stroke();

  if (step < 4) return;

  // שלב 4: רגליים
  ctx.beginPath();
  ctx.moveTo(105, 110);
  ctx.lineTo(85, 140);
  ctx.moveTo(105, 110);
  ctx.lineTo(125, 140);
  ctx.stroke();
}

const KB_LAYOUT = [
  ["ק", "ר", "א", "ט", "ו", "ן", "ם", "פ"],
  ["ש", "ד", "ג", "כ", "ע", "י", "ח", "ל", "ך", "ף"],
  ["ז", "ס", "ב", "ה", "נ", "מ", "צ", "ת", "ץ"]
];

function buildKeyboard() {
  const container = document.getElementById("keyboard");
  container.innerHTML = "";
  KB_LAYOUT.forEach(row => {
    const rowDiv = document.createElement("div");
    rowDiv.className = "kb-row";
    row.forEach(letter => {
      const btn = document.createElement("button");
      btn.className = "key-btn";
      btn.id = `key-${letter}`;
      btn.textContent = letter;
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        unlockAudio();
        handleLetterGuess(letter);
      });
      rowDiv.appendChild(btn);
    });
    container.appendChild(rowDiv);
  });
}

function startNewRound() {
  document.getElementById("end-modal").style.display = "none";
  guessedLetters.clear();
  wrongAttempts = 0;
  isRoundActive = true;

  currentSnake = SPECIES_LIST[Math.floor(Math.random() * SPECIES_LIST.length)];

  const imgEl = document.getElementById("snake-image");
  const rawName = currentSnake.name;
  const encodedName = encodeURIComponent(rawName);

  const possibleUrls = [
    `images/${encodedName}.jpg`,
    `images/${encodedName}.JPG`,
    `images/${rawName}.jpg`,
    `images/${rawName}.JPG`,
    `images/${encodedName}.jpeg`,
    `images/${encodedName}.png`
  ];

  let attemptIdx = 0;
  function tryNextImage() {
    if (attemptIdx < possibleUrls.length) {
      imgEl.src = possibleUrls[attemptIdx];
      attemptIdx++;
    }
  }

  imgEl.onerror = tryNextImage;
  attemptIdx = 0;
  tryNextImage();

  const tagEl = document.getElementById("species-tag");
  tagEl.textContent = `רמז: ${currentSnake.label}`;
  tagEl.style.color = currentSnake.color;
  document.getElementById("snake-card").style.borderColor = currentSnake.color;

  updateWordDisplay();
  drawGallows(0);
  document.getElementById("remaining-attempts").textContent = MAX_MISTAKES;
  buildKeyboard();
}

function updateWordDisplay() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  const name = currentSnake.name;
  let allRevealed = true;

  for (let i = 0; i < name.length; i++) {
    const ch = name[i];
    const slot = document.createElement("div");

    if (ch === " ") {
      slot.className = "letter-slot space";
    } else {
      slot.className = "letter-slot";
      const normalizedCh = normalizeChar(ch);
      if (guessedLetters.has(normalizedCh)) {
        slot.textContent = ch;
      } else {
        slot.textContent = "";
        allRevealed = false;
      }
    }
    container.appendChild(slot);
  }

  if (allRevealed && isRoundActive) {
    endRound(true);
  }
}

function handleLetterGuess(letter) {
  if (!isRoundActive) return;
  unlockAudio();
  const norm = normalizeChar(letter);
  if (guessedLetters.has(norm)) return;

  guessedLetters.add(norm);

  const btn = document.getElementById(`key-${letter}`);
  const targetNormalized = Array.from(currentSnake.name).map(normalizeChar);

  if (targetNormalized.includes(norm)) {
    if (btn) btn.classList.add("correct");
    Sounds.correct();
    updateWordDisplay();
  } else {
    if (btn) btn.classList.add("wrong");
    Sounds.wrong();
    wrongAttempts++;
    drawGallows(wrongAttempts);
    document.getElementById("remaining-attempts").textContent = MAX_MISTAKES - wrongAttempts;

    if (wrongAttempts >= MAX_MISTAKES) {
      endRound(false);
    }
  }

  if (btn) btn.disabled = true;
}

function endRound(isWin) {
  isRoundActive = false;
  const modal = document.getElementById("end-modal");
  const title = document.getElementById("modal-title");
  const desc = document.getElementById("modal-desc");

  if (isWin) {
    streak++;
    Sounds.win();
    title.textContent = "🏆 זיהוי מדויק!";
    title.style.color = "#00ffcc";
    desc.textContent = `כל הכבוד! הנחש הוא: ${currentSnake.name}`;
  } else {
    streak = 0;
    Sounds.lose();
    title.textContent = "☠️ נפסלת!";
    title.style.color = "#ff4757";
    desc.textContent = `הנחש בתמונה היה: ${currentSnake.name}`;
    revealFullWord();
  }

  document.getElementById("streak").textContent = streak;
  modal.style.display = "flex";
}

function revealFullWord() {
  const container = document.getElementById("word-container");
  container.innerHTML = "";
  for (let ch of currentSnake.name) {
    const slot = document.createElement("div");
    slot.className = ch === " " ? "letter-slot space" : "letter-slot";
    slot.textContent = ch;
    if (ch !== " ") slot.style.color = "#ff6b81";
    container.appendChild(slot);
  }
}

window.addEventListener("keydown", (e) => {
  if (!isRoundActive) return;
  unlockAudio();
  const key = e.key;
  if (/^[א-ת]$/.test(key)) {
    handleLetterGuess(key);
  }
});

startNewRound();
</script>
</body>
</html>
